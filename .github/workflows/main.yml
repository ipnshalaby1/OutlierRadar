name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Stealth
        run: |
          npm install playwright-extra puppeteer-extra-plugin-stealth axios playwright
          npx playwright install --with-deps chromium

      - name: Run Stealth Sniper Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          node -e '
          const { chromium } = require("playwright-extra");
          const stealth = require("puppeteer-extra-plugin-stealth")();
          chromium.use(stealth);
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🕵️ 1. Starting Playwright Stealth Sniper...");
              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                  viewport: { width: 390, height: 844 },
                  userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
              });
              const page = await context.newPage();

              try {
                  console.log("🌐 2. Navigating to login...");
                  await page.goto("https://www.multimango.com/login", { waitUntil: "domcontentloaded" });
                  
                  console.log("⏳ 3. Waiting for Clerk form to bypass protection...");
                  await page.waitForTimeout(6000);

                  // فحص مبدئي سريع للشاشة
                  const initialText = await page.evaluate(() => document.body.innerText);
                  if(initialText.includes("Cloudflare") || initialText.includes("Checking your browser")) {
                      console.log("⚠️ WARNING: Cloudflare protection detected!");
                      await page.waitForTimeout(5000); // ننتظر كلاود فلير يمررنا
                  }

                  console.log("✅ 4. Clicking Terms Checkbox...");
                  // استهداف نص الموافقة نفسه والضغط عليه
                  const termsLabel = page.locator("label").filter({ hasText: "I agree" });
                  await termsLabel.click({ force: true }).catch(() => console.log("   -> Could not click terms label smoothly, trying to force it..."));
                  await page.waitForTimeout(1500);

                  console.log("📧 5. Typing Email...");
                  // استهداف الخانة بالـ Placeholder الموجود في صورتك تحديداً
                  const emailInput = page.getByPlaceholder("Enter your email address");
                  await emailInput.fill(process.env.EMAIL);
                  await page.waitForTimeout(500);

                  console.log("👉 6. Clicking Continue...");
                  await page.getByRole("button", { name: "Continue", exact: false }).first().click();
                  
                  console.log("🔐 7. Waiting for Password field...");
                  await page.waitForTimeout(5000);
                  
                  // استهداف خانة الباسورد
                  const passInput = page.locator("input[type=\"password\"]");
                  await passInput.fill(process.env.PASSWORD);
                  await page.waitForTimeout(500);

                  console.log("👉 8. Clicking Continue (Login)...");
                  await page.getByRole("button", { name: "Continue", exact: false }).last().click();

                  console.log("⏳ 9. Waiting for redirect...");
                  await page.waitForTimeout(12000);

                  console.log("🎯 10. Checking API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response.");
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
                  // طباعة محتوى الشاشة بالكامل لمعرفة سبب الفشل (هل هو كلاود فلير أم لغة مختلفة)
                  const text = await page.evaluate(() => document.body.innerText).catch(()=>"No text readable");
                  console.log("📄 Page state at failure:", text.substring(0, 400).replace(/\n/g, " | "));
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
