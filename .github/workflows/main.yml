name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Ultimate Bypass Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install playwright-extra puppeteer-extra-plugin-stealth axios playwright ghost-cursor
          npx playwright install --with-deps chromium

      - name: Run Nuclear Bypass Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        # تشغيل المتصفح داخل شاشة وهمية لتخطي فحص Headless
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node -e '
          const { chromium } = require("playwright-extra");
          const stealth = require("puppeteer-extra-plugin-stealth")();
          chromium.use(stealth);
          const { createCursor } = require("ghost-cursor");
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🖥️ 1. Launching Real Browser in Virtual Display...");
              // المتصفح يعمل بشكل مرئي كامل بدون تخفي Headless
              const browser = await chromium.launch({ 
                  headless: false, 
                  args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"] 
              });
              
              const context = await browser.newContext({
                  viewport: { width: 1280, height: 960 },
                  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();
              
              console.log("👻 2. Activating Ghost Cursor...");
              const cursor = createCursor(page);

              try {
                  console.log("🌐 3. Navigating to SIGN-IN page...");
                  await page.goto("https://www.multimango.com/sign-in", { waitUntil: "networkidle" });
                  
                  console.log("⏳ 4. Waiting for Cloudflare/Clerk checks to pass...");
                  await page.waitForTimeout(8000);

                  console.log("✅ 5. Human-clicking the Terms...");
                  const termsTarget = page.locator("text=I agree").first();
                  await cursor.click(termsTarget).catch(async () => {
                      console.log("   -> Fallback to role checkbox");
                      await cursor.click(page.getByRole("checkbox").first());
                  });
                  await page.waitForTimeout(2000);

                  console.log("📧 6. Human-typing Email...");
                  const emailInput = page.locator("input[type=\"email\"], input[name=\"identifier\"]").first();
                  await cursor.click(emailInput);
                  await emailInput.fill(process.env.EMAIL);
                  await page.waitForTimeout(1500);

                  console.log("👉 7. Human-clicking Continue...");
                  const continueBtn1 = page.locator("button:has-text(\"Continue\")").first();
                  await cursor.click(continueBtn1);
                  
                  console.log("🔐 8. Waiting for Password field...");
                  await page.waitForTimeout(5000);
                  
                  const passInput = page.locator("input[type=\"password\"]").first();
                  await cursor.click(passInput);
                  await passInput.fill(process.env.PASSWORD);
                  await page.waitForTimeout(1500);

                  console.log("👉 9. Human-clicking Continue (Login)...");
                  const continueBtn2 = page.locator("button:has-text(\"Continue\")").last();
                  await cursor.click(continueBtn2);

                  console.log("⏳ 10. Waiting for Clerk session redirect...");
                  await page.waitForTimeout(15000);

                  console.log("🎯 11. Hitting the API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response.");
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
