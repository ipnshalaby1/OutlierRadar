name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright, Ghost Cursor, and Axios
        run: |
          npm install playwright ghost-cursor axios
          npx playwright install --with-deps chromium

      - name: Run Heavy Weapons Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          node -e '
          const { chromium } = require("playwright");
          const { createCursor } = require("ghost-cursor");
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🚀 1. Launching Playwright...");
              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();
              
              console.log("👻 2. Activating Ghost Cursor...");
              const cursor = createCursor(page);

              try {
                  console.log("🌐 3. Navigating to login...");
                  await page.goto("https://www.multimango.com/login", { waitUntil: "networkidle" });
                  await page.waitForTimeout(6000);

                  console.log("✅ 4. Hunting for Terms by Text...");
                  try {
                      // Playwright يخترق الصناديق ويبحث بالنص
                      const termsEl = await page.$("text=/I agree/i");
                      if (termsEl) {
                          await cursor.click(termsEl);
                          console.log("   -> Ghost Cursor clicked Terms!");
                          await page.waitForTimeout(2000);
                      }
                  } catch (e) {
                      console.log("   -> Terms not found, moving on.");
                  }
                  
                  console.log("📧 5. Hunting for Email field...");
                  const emailEl = await page.$("input[type=\"email\"], input[name=\"identifier\"]");
                  if (emailEl) {
                      await cursor.click(emailEl);
                      console.log("   -> Ghost Cursor clicked Email.");
                      await emailEl.type(process.env.EMAIL, { delay: 150 });
                      await page.keyboard.press("Enter");
                  } else {
                      throw new Error("Email field not found!");
                  }
                  
                  console.log("🔐 6. Hunting for Password field...");
                  await page.waitForTimeout(5000);
                  const passEl = await page.$("input[type=\"password\"], input[name=\"password\"]");
                  if (passEl) {
                      await cursor.click(passEl);
                      console.log("   -> Ghost Cursor clicked Password.");
                      await passEl.type(process.env.PASSWORD, { delay: 150 });
                      await page.keyboard.press("Enter");
                  } else {
                      throw new Error("Password field not found!");
                  }

                  console.log("⏳ 7. Waiting for Clerk authentication...");
                  await page.waitForTimeout(15000); // انتظار 15 ثانية للتحويل الكامل

                  console.log("🎯 8. Hitting the API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  // جلب محتوى الصفحة بالكامل
                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else if (body.includes("Authentication required")) {
                      console.log("Result: Still getting auth error. Session hijacked needed.");
                  } else {
                      console.log("Result: Unknown. Full length:", body.length);
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
