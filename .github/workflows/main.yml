name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Virtual Display & Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install playwright-extra puppeteer-extra-plugin-stealth axios playwright
          npx playwright install --with-deps chromium

      - name: Run Script in Virtual Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        # السطر القادم هو السحر: تشغيل نود داخل شاشة وهمية 
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node -e '
          const { chromium } = require("playwright-extra");
          const stealth = require("puppeteer-extra-plugin-stealth")();
          chromium.use(stealth);
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🖥️ 1. Starting Real Browser (Headed Mode) inside Virtual Monitor...");
              // لاحظ: تم إغلاق وضع التخفي التقليدي، المتصفح يعمل بواجهة كاملة!
              const browser = await chromium.launch({ 
                  headless: false, 
                  args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"] 
              });
              
              const context = await browser.newContext({
                  viewport: { width: 1280, height: 960 },
                  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();

              try {
                  console.log("🌐 2. Navigating to login...");
                  await page.goto("https://www.multimango.com/login", { waitUntil: "networkidle" });
                  
                  console.log("⏳ 3. Waiting for Anti-Bot checks to pass naturally...");
                  await page.waitForTimeout(8000);

                  console.log("✅ 4. Clicking Checkbox...");
                  const checkbox = page.getByRole("checkbox");
                  await checkbox.click({ force: true }).catch(() => console.log("Checkbox issue, ignoring..."));
                  
                  // انتظار أطول للسماح للصفحة البيضاء بالتحميل إذا ظهرت
                  await page.waitForTimeout(4000);

                  console.log("📧 5. Typing Email...");
                  const emailInput = page.locator("input[type=\"email\"], input[name=\"identifier\"]").first();
                  await emailInput.fill(process.env.EMAIL);
                  await page.waitForTimeout(1000);

                  console.log("👉 6. Clicking Continue...");
                  await page.getByRole("button", { name: "Continue", exact: false }).first().click();
                  
                  console.log("🔐 7. Waiting for Password field...");
                  await page.waitForTimeout(5000);
                  
                  const passInput = page.locator("input[type=\"password\"]");
                  await passInput.fill(process.env.PASSWORD);
                  await page.waitForTimeout(1000);

                  console.log("👉 8. Clicking Continue (Login)...");
                  await page.getByRole("button", { name: "Continue", exact: false }).last().click();

                  console.log("⏳ 9. Waiting for redirect...");
                  await page.waitForTimeout(15000);

                  console.log("🎯 10. Checking API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response.");
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
