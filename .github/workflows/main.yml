name: Outlier Radar Bot (API Direct)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Axios
        run: npm install axios

      - name: Run Direct API Bypass
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          node -e '
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🚀 Starting Direct API Bypass (Cookie Auth)...");
              
              if (!process.env.COOKIE) {
                  console.error("❌ ERROR: COOKIE secret is missing in GitHub!");
                  process.exit(1);
              }

              try {
                  const response = await axios.get("https://www.multimango.com/api/omni-elo?capability=tts", {
                      headers: {
                          "Cookie": process.env.COOKIE,
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                      }
                  });
                  
                  // تحويل الرد إلى نص لسهولة الفحص
                  const body = typeof response.data === "object" ? JSON.stringify(response.data) : response.data;
                  console.log("API Result Snippet:", body.substring(0, 150));

                  // فحص النتيجة
                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response structure.");
                  }
                  
              } catch (err) {
                  if (err.response && (err.response.status === 401 || err.response.status === 403)) {
                      console.error("❌ HTTP " + err.response.status + ": Cookie expired or invalid! You need to update the COOKIE secret in GitHub.");
                  } else {
                      console.error("❌ Execution failed:", err.message);
                  }
              }
          })();
          '
