name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install playwright-extra puppeteer-extra-plugin-stealth axios playwright
          npx playwright install --with-deps chromium

      - name: Run UI Automation Bypass
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node -e '
          const { chromium } = require("playwright-extra");
          const stealth = require("puppeteer-extra-plugin-stealth")();
          chromium.use(stealth);
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("🖥️ 1. Launching Real Browser in Virtual Display...");
              const browser = await chromium.launch({ 
                  headless: false, // متصفح حقيقي مرئي لتخطي Cloudflare
                  args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"] 
              });
              
              const context = await browser.newContext({
                  viewport: { width: 1280, height: 960 },
                  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              });
              const page = await context.newPage();

              try {
                  console.log("🌐 2. Navigating to SIGN-IN page...");
                  await page.goto("https://www.multimango.com/sign-in", { waitUntil: "networkidle" });
                  
                  console.log("⏳ 3. Waiting for form to load...");
                  await page.waitForTimeout(6000);

                  console.log("✅ 4. Handling Terms Checkbox (if exists)...");
                  try {
                      // بناءً على الفيديو، سنضغط على المربع إذا كان موجوداً
                      const checkbox = page.getByRole("checkbox");
                      if (await checkbox.count() > 0) {
                          await checkbox.first().click({ force: true });
                          console.log("   -> Checkbox clicked.");
                      } else {
                          // محاولة الضغط على النص كبديل
                          await page.locator("text=I agree").first().click();
                          console.log("   -> Text clicked.");
                      }
                  } catch (e) {
                      console.log("   -> Could not click terms, maybe already accepted or missing. Moving on...");
                  }
                  await page.waitForTimeout(2000);

                  console.log("📧 5. Typing Email...");
                  const emailInput = page.locator("input[type=\"email\"], input[name=\"identifier\"]").first();
                  await emailInput.fill(process.env.EMAIL);
                  await page.waitForTimeout(1000);

                  console.log("👉 6. Clicking Continue...");
                  const continueBtn1 = page.locator("button:has-text(\"Continue\")").first();
                  await continueBtn1.click();
                  
                  console.log("🔐 7. Waiting for Password field...");
                  await page.waitForTimeout(5000); // انتظار الشاشة التانية زي الفيديو
                  
                  const passInput = page.locator("input[type=\"password\"]").first();
                  await passInput.fill(process.env.PASSWORD);
                  await page.waitForTimeout(1000);

                  console.log("👉 8. Clicking Continue (Login)...");
                  const continueBtn2 = page.locator("button:has-text(\"Continue\")").last();
                  await continueBtn2.click();

                  console.log("⏳ 9. Waiting for Clerk session redirect...");
                  await page.waitForTimeout(15000);

                  console.log("🎯 10. Hitting the API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response.");
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
