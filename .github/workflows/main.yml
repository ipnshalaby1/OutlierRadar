name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright axios
          npx playwright install --with-deps chromium

      - name: Run Mobile Simulation Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          node -e '
          const { chromium, devices } = require("playwright");
          const axios = require("axios");

          // إعدادات محاكاة آيفون 13 لخداع حماية الموقع
          const iPhone = devices["iPhone 13"];

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("📱 1. Starting Playwright in Mobile Mode...");
              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({
                  ...iPhone,
                  userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1"
              });
              const page = await context.newPage();

              try {
                  console.log("🌐 2. Navigating to login...");
                  await page.goto("https://www.multimango.com/login", { waitUntil: "networkidle" });
                  await page.waitForTimeout(5000);

                  console.log("✅ 3. Clicking the Terms TEXT (Not the checkbox)...");
                  // الضغط على النص نفسه بدلا من المربع
                  const termsText = page.locator("text=I agree to the Terms of Use");
                  await termsText.click({ force: true });
                  await page.waitForTimeout(2000);
                  
                  console.log("📧 4. Typing Email...");
                  // البحث عن خانة الإيميل وكتابته
                  await page.locator("input[type=\"email\"], input[name=\"identifier\"]").fill(process.env.EMAIL);
                  await page.waitForTimeout(1000);

                  console.log("👉 5. Clicking Continue...");
                  // الضغط على زرار Continue اللي ظهر في صورتك
                  await page.locator("button:has-text(\"Continue\")").click();
                  
                  console.log("🔐 6. Waiting for Password field...");
                  await page.waitForTimeout(4000); // انتظار تحميل الخطوة الثانية
                  
                  // كتابة الباسورد
                  const passLocator = page.locator("input[type=\"password\"], input[name=\"password\"]");
                  await passLocator.fill(process.env.PASSWORD);
                  await page.waitForTimeout(1000);

                  console.log("👉 7. Clicking Continue (Login)...");
                  await page.locator("button:has-text(\"Continue\")").click();

                  console.log("⏳ 8. Waiting for Clerk authentication redirect...");
                  await page.waitForTimeout(12000); // انتظار كافي جدا للموقع يحمل الصفحة الرئيسية

                  console.log("🎯 9. Hitting the Target API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle" });

                  const body = await page.locator("body").innerText();
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else {
                      console.log("Result: Unknown response. snippet:", body.substring(0, 50));
                  }

              } catch (err) {
                  console.error("❌ Execution failed:", err.message);
              } finally {
                  await browser.close();
                  console.log("🏁 Done.");
              }
          })();
          '
