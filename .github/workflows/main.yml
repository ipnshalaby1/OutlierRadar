name: Outlier Radar Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer and Stealth Plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth axios

      - name: Run Script Directly
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          node -e '
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          puppeteer.use(StealthPlugin());
          const axios = require("axios");

          async function sendTelegram(text) {
              const url = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
              try { await axios.post(url, { chat_id: process.env.CHAT_ID, text: text }); } catch (e) {}
          }

          (async () => {
              console.log("1. Starting browser (Human Simulation Mode)...");
              const browser = await puppeteer.launch({
                  headless: true,
                  args: ["--no-sandbox", "--disable-setuid-sandbox"]
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 800 });

              try {
                  console.log("2. Navigating to login page...");
                  await page.goto("https://www.multimango.com/login", { waitUntil: "networkidle0", timeout: 60000 });

                  console.log("3. Waiting for Clerk to fully load...");
                  await new Promise(r => setTimeout(r, 10000)); // زيادة وقت الانتظار الأولي

                  console.log("4. Executing Blind Human Bypass sequence...");
                  
                  // التركيز على الصفحة لتفعيل الكيبورد
                  await page.bringToFront();
                  await page.mouse.click(10, 10);
                  await new Promise(r => setTimeout(r, 2000));

                  // الخطوة 1: الضغط على Tab للوصول لمربع الشروط
                  await page.keyboard.press("Tab");
                  await new Promise(r => setTimeout(r, 1500));
                  
                  // الخطوة 2: الموافقة على الشروط
                  await page.keyboard.press("Space");
                  console.log("   -> Pressed Space for terms.");
                  await new Promise(r => setTimeout(r, 3000)); // زيادة وقت الانتظار بعد قبول الشروط

                  // الخطوة 3: التنقل لحقل الإيميل
                  await page.keyboard.press("Tab");
                  await new Promise(r => setTimeout(r, 1000));
                  
                  // الخطوة 4: كتابة الإيميل (إبطاء سرعة الكتابة)
                  await page.keyboard.type(process.env.EMAIL, { delay: 100 });
                  console.log("   -> Typed Email.");
                  await new Promise(r => setTimeout(r, 2000)); // انتظار أطول قبل ضغط Enter
                  await page.keyboard.press("Enter");
                  console.log("   -> Pressed Enter after Email.");

                  // الخطوة 5: انتظار تحميل صفحة الباسورد
                  await new Promise(r => setTimeout(r, 8000)); // زيادة وقت الانتظار لصفحة الباسورد

                  // الخطوة 6: كتابة الباسورد (إبطاء سرعة الكتابة)
                  await page.keyboard.type(process.env.PASSWORD, { delay: 100 });
                  console.log("   -> Typed Password.");
                  await new Promise(r => setTimeout(r, 2000)); // انتظار أطول قبل ضغط Enter
                  
                  const navigationPromise = page.waitForNavigation({ waitUntil: "networkidle2", timeout: 30000 }).catch(() => null);
                  
                  await page.keyboard.press("Enter");
                  console.log("   -> Pressed Enter after Password.");

                  console.log("5. Waiting for authentication and redirect...");
                  await navigationPromise;
                  await new Promise(r => setTimeout(r, 10000)); // زيادة وقت الانتظار بعد التوجيه

                  console.log("6. Checking target API...");
                  await page.goto("https://www.multimango.com/api/omni-elo?capability=tts", { waitUntil: "networkidle2" });

                  const body = await page.evaluate(() => document.body.innerText);
                  console.log("API Result Snippet:", body.substring(0, 150));

                  if (body.includes("NO_LANGUAGE_MATCHES") || body.includes("No comparison candidates") || body.includes("errorCode\":\"NO_LANGUAGE_MATCHES")) {
                      console.log("Result: No tasks online.");
                  } else if (body.includes(".wav") || body.includes("scontent")) {
                      await sendTelegram("omni task online 🟢");
                      console.log("Result: Task detected! Telegram alerted.");
                  } else if (body.includes("Authentication required")) {
                      console.log("Result: Failed to login properly. Still showing auth error.");
                  } else {
                      console.log("Result: Unknown response. Body length:", body.length);
                  }
              } catch (err) {
                  console.error("Execution failed at:", err.message);
              } finally {
                  await browser.close();
                  console.log("Done.");
              }
          })();
          '
